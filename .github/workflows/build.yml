name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (Plugin + Paket)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -S . -B build -A x64

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Pakete erstellen
        run: |
          cmake --install build --config Release --prefix dist/RE2R-Coop --component re2r-coop
          cmake --install build --config Release --prefix dist/RE-Multiplayer-Tools --component tools

      # Download unter "Actions" -> Lauf anklicken -> "Artifacts" -> RE2R-Coop.
      # Inhalt direkt in den RE2-Spielordner entpacken.
      - uses: actions/upload-artifact@v4
        with:
          name: RE2R-Coop
          path: dist/RE2R-Coop

      # Testbot & Co. - NICHT in den Spielordner, sondern irgendwo hin entpacken.
      - uses: actions/upload-artifact@v4
        with:
          name: RE-Multiplayer-Tools
          path: dist/RE-Multiplayer-Tools

  windows-x86:
    name: Windows 32-Bit (RE0 HD)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -S . -B build32 -A Win32

      - name: Bauen
        run: cmake --build build32 --config Release --parallel

      - name: Tests
        run: ctest --test-dir build32 -C Release --output-on-failure

      - name: Paket erstellen
        run: cmake --install build32 --config Release --prefix dist/RE0HD-Coop --component re0hd-coop

      - name: Exporte pruefen
        shell: pwsh
        run: |
          # Der Loader muss DirectInput8Create unter genau diesem Namen exportieren
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x86/dumpbin.exe" | Select-Object -First 1
          $out = & $dumpbin.FullName /exports dist/RE0HD-Coop/dinput8.dll | Out-String
          Write-Output $out
          if ($out -notmatch "\sDirectInput8Create\s") { throw "DirectInput8Create fehlt" }
          $out = & $dumpbin.FullName /exports dist/RE0HD-Coop/remultiplayer/remultiplayer_re0.dll | Out-String
          if ($out -notmatch "\sremultiplayer_init\s") { throw "remultiplayer_init fehlt" }
          $hdr = & $dumpbin.FullName /headers dist/RE0HD-Coop/dinput8.dll | Out-String
          if ($hdr -notmatch "14C machine \(x86\)") { throw "dinput8.dll ist nicht 32-Bit" }

      - name: Installer erstellen und pruefen
        shell: pwsh
        run: |
          cmake --install build32 --config Release --prefix dist/RE0HD-Installer --component re0hd-installer
          $exe = (Resolve-Path dist/RE0HD-Installer/RE-Multiplayer-RE0-Installer.exe).Path
          # Testlauf in einem Fake-Spielordner (re0hd.exe = beliebige exe)
          $game = Join-Path $env:RUNNER_TEMP "re0_fake"
          New-Item -ItemType Directory -Force $game | Out-Null
          Copy-Item $exe (Join-Path $game "re0hd.exe")
          Set-Content (Join-Path $game "dinput8.dll") "fremde Mod"
          $p = Start-Process $exe -ArgumentList "--path `"$game`" --install --quiet" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation fehlgeschlagen ($($p.ExitCode))" }
          foreach ($f in "dinput8.dll", "dinput8.dll.vor-remultiplayer", "remultiplayer/remultiplayer_re0.dll", "remultiplayer/autorun/re0hd_coop.lua", "remultiplayer/autorun/remultiplayer_coop/session.lua", "remultiplayer/lib/json.lua") {
            if (-not (Test-Path (Join-Path $game $f))) { throw "$f fehlt nach der Installation" }
          }
          $p = Start-Process $exe -ArgumentList "--path `"$game`" --uninstall --quiet" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Deinstallation fehlgeschlagen ($($p.ExitCode))" }
          if (Test-Path (Join-Path $game "remultiplayer/remultiplayer_re0.dll")) { throw "Runtime nach Deinstallation noch da" }
          if ((Get-Content (Join-Path $game "dinput8.dll")) -ne "fremde Mod") { throw "fremde dinput8.dll nicht wiederhergestellt" }
          Write-Output "Installer ok"

      # Download unter "Actions" -> Lauf anklicken -> "Artifacts" -> RE0HD-Coop.
      # Inhalt direkt in den RE0-Spielordner entpacken (neben re0hd.exe).
      - uses: actions/upload-artifact@v4
        with:
          name: RE0HD-Coop
          path: dist/RE0HD-Coop

      # Ein-Datei-Installer zum Weitergeben
      - uses: actions/upload-artifact@v4
        with:
          name: RE0HD-Installer
          path: dist/RE0HD-Installer

  linux:
    name: Linux (Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurieren
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Bauen
        run: cmake --build build --parallel
      - name: Tests
        run: ctest --test-dir build --output-on-failure
