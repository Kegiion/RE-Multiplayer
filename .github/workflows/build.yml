name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (Plugin + Paket)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -S . -B build -A x64

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Pakete erstellen
        run: |
          cmake --install build --config Release --prefix dist/RE2R-Coop --component re2r-coop
          cmake --install build --config Release --prefix dist/REMods-Tools --component tools

      # Download unter "Actions" -> Lauf anklicken -> "Artifacts" -> RE2R-Coop.
      # Inhalt direkt in den RE2-Spielordner entpacken.
      - uses: actions/upload-artifact@v4
        with:
          name: RE2R-Coop
          path: dist/RE2R-Coop

      # Testbot & Co. - NICHT in den Spielordner, sondern irgendwo hin entpacken.
      - uses: actions/upload-artifact@v4
        with:
          name: REMods-Tools
          path: dist/REMods-Tools

  linux:
    name: Linux (Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurieren
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Bauen
        run: cmake --build build --parallel
      - name: Tests
        run: ctest --test-dir build --output-on-failure
