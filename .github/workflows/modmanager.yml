name: Mod-Manager

# Baut und testet den REMods Mod-Manager (tools/modmanager).
# Artifact "REMods-Manager" = die fertige exe, "REMods-Manager-Bilder" = Bildschirmfotos zur Sichtpruefung.

on:
  push:
    paths:
      - 'tools/modmanager/**'
      - 'tools/release/**'
      - '.github/workflows/modmanager.yml'
  pull_request:
    paths:
      - 'tools/modmanager/**'
      - 'tools/release/**'
      - '.github/workflows/modmanager.yml'
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tests
        run: dotnet test tools/modmanager/tests/ModManager.Tests -c Release

  windows:
    name: Windows (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: dotnet test tools/modmanager/tests/ModManager.Tests -c Release

      - name: exe bauen
        run: >-
          dotnet publish tools/modmanager/src/ModManager.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist/REMods-Manager

      - name: Installieren und Deinstallieren pruefen (Fake-Spielordner)
        shell: pwsh
        run: ./tools/modmanager/ci/e2e.ps1 -Exe dist/REMods-Manager/REMods-Manager.exe

      - name: Bildschirmfotos
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/REMods-Manager/REMods-Manager.exe).Path
          $dir = Join-Path $pwd 'dist/bilder'
          foreach ($shot in @('demo-920x660', 'demo-720x500', 'echt-920x660')) {
            $parts = $shot.Split('-')
            $argList = "--screenshot `"$dir/$shot.png`" --size $($parts[1])"
            if ($parts[0] -eq 'demo') { $argList += ' --demo' }
            $p = Start-Process $exe -ArgumentList $argList -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content (Join-Path $env:LOCALAPPDATA 'REMods/manager.log') -ErrorAction SilentlyContinue | Select-Object -Last 30
              throw "Bildschirmfoto $shot fehlgeschlagen"
            }
          }
          Get-ChildItem $dir

      - uses: actions/upload-artifact@v4
        with:
          name: REMods-Manager
          path: dist/REMods-Manager/REMods-Manager.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REMods-Manager-Bilder
          path: dist/bilder
          if-no-files-found: ignore
